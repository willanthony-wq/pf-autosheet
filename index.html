<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PF Autosheet</title>
  <meta name="description" content="Pathfinder 1e character sheet (a web version of the Pathfinder Autosheet v6.2.1) with Discord dice rolls.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/sheet.css?v=20261126235945">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cpolygon points='50,4 93,28 93,72 50,96 7,72 7,28' fill='%238e2f1c'/%3E%3Ctext x='50' y='63' font-size='38' text-anchor='middle' fill='white' font-family='Georgia'%3E20%3C/text%3E%3C/svg%3E">
</head>
<body>
  <div class="topbar">
    <span class="brand">PF Autosheet</span>
    <select id="roster" aria-label="Character"></select>
    <button class="btn small" data-action="new-char">New</button>
    <button class="btn small" data-action="import">Import</button>
    <button class="btn small" data-action="export">Export</button>
    <span class="spacer"></span>
    <span id="discord-state" class="discord-state"></span>
    <span id="save-state" class="save-state" aria-live="polite"></span>
  </div>
  <nav id="tabs" class="tabs" role="tablist" aria-label="Sheet sections"></nav>

  <div class="layout">
    <main id="main"></main>
    <aside class="side">
      <section class="card">
        <header><h2>Dice</h2><span class="spacer"></span><button class="btn small ghost" data-action="clear-log">Clear log</button></header>
        <div class="dice-box">
          <input type="text" id="dice-expr" placeholder="2d6+3" aria-label="Dice expression" autocomplete="off">
          <button class="btn primary" data-action="roll-expr">Roll</button>
        </div>
        <div class="quick-dice">
          <button class="btn small" data-action="quick-die" data-expr="1d4">d4</button>
          <button class="btn small" data-action="quick-die" data-expr="1d6">d6</button>
          <button class="btn small" data-action="quick-die" data-expr="1d8">d8</button>
          <button class="btn small" data-action="quick-die" data-expr="1d10">d10</button>
          <button class="btn small" data-action="quick-die" data-expr="1d12">d12</button>
          <button class="btn small" data-action="quick-die" data-expr="1d20">d20</button>
          <button class="btn small" data-action="quick-die" data-expr="1d100">d%</button>
        </div>
        <p class="small muted" style="margin:6px 0 0">Shift-click any roll to keep it private.</p>
      </section>
      <div id="active-side"></div>
      <section class="card" style="display:flex;flex-direction:column;min-height:0;flex:1">
        <header><h2>Roll log</h2></header>
        <div id="log" class="log" aria-live="polite"></div>
      </section>
    </aside>
  </div>

  <input type="file" id="file-input" accept=".xlsx,.json,.por,.xml,application/json" class="hidden">
  <dialog id="import-dialog">
    <h2>Import</h2>
    <div id="import-body"></div>
    <form method="dialog" class="actions"><button class="btn primary">OK</button></form>
  </dialog>

  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <script src="js/data.js?v=20261126235945"></script>
  <script src="js/attacks-extra.js?v=20261126235945"></script>
  <script src="js/model.js?v=20261126235945"></script>
  <script src="js/races.js?v=20261126235945"></script>
  <script src="js/companion.js?v=20261126235945"></script>
  <script src="js/feats.js?v=20261126235945"></script>
  <script src="js/engine.js?v=20261126235945"></script>
  <script src="js/herolab.js?v=20261126235945"></script>
  <script src="js/import.js?v=20261126235945"></script>
  <script src="js/dice.js?v=20261126235945"></script>
  <script src="js/discord.js?v=20261126235945"></script>
  <script src="js/srd.js?v=20261126235945"></script>
  <script src="js/app.js?v=20261126235945"></script>
</body>
</html>
